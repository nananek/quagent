<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quagent</title>
<link rel="stylesheet" href="/assets/xterm.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header>
  <h1 id="session-name">{{.Name}}</h1>
  <span id="conn" class="conn">接続中…</span>
</header>
<main>
  <section id="terminal-wrap"><div id="terminal" aria-label="エージェントの端末"></div></section>
  <aside id="approvals">
    <div id="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" data-tab="pending" aria-selected="true">承認待ち<span class="badge" id="badge-pending"></span></button>
      <button type="button" role="tab" class="tab" data-tab="logs" aria-selected="false">ログ<span class="badge" id="badge-logs"></span></button>
      <button type="button" role="tab" class="tab" data-tab="history" aria-selected="false">履歴<span class="badge" id="badge-history"></span></button>
    </div>
    <div id="reissue">
      <button id="reissue-btn" type="button">アクセス URL を再発行</button>
      <p id="reissue-result" hidden></p>
    </div>
    <div id="approval-list" class="panel"><p class="reason">承認待ちはありません。</p></div>
    <div id="log-list" class="panel" hidden></div>
    <div id="history-list" class="panel" hidden></div>
  </aside>
</main>
<script src="/assets/xterm.js"></script>
<script src="/assets/addon-fit.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
