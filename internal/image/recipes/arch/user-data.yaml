#cloud-config
# quagent ベースイメージ (Arch Linux, hardened)。{{.User}} と {{.Marker}} は quagent が埋める。
# 成功したら {{.Marker}} をシリアルコンソールに出し、最後に電源を切ること。
users:
  - name: {{.User}}
    shell: /bin/bash
    lock_passwd: true
write_files:
  # linux-hardened で rootless docker / slirp4netns / fuse-overlayfs を動かすために
  # 非特権 user namespace を許可する
  - path: /etc/sysctl.d/99-quagent-hardened.conf
    permissions: '0644'
    content: |
      kernel.unprivileged_userns_clone=1
  # slirp4netns (rootless docker のネットワーク) が使う。ip_tables は
  # rootless docker が iptables を使うため。
  - path: /etc/modules-load.d/quagent.conf
    permissions: '0644'
    content: |
      tun
      overlay
      ip_tables
  - path: /usr/local/sbin/quagent-build.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail
      # シリアル getty は ttyS0 を初期化し直すときに焼き込みの出力を消すことが
      # あるので止める (Gentoo と同じ。実行時のイメージには残らない)。
      systemctl stop serial-getty@ttyS0.service || true
      U={{.User}}
      UID_=$(id -u "$U")

      pacman-key --init
      pacman-key --populate archlinux
      # 焼き込み中は再起動しないので、動いているカーネル (linux) はまだ消さない
      # (モジュールが消えると docker が使えない)。
      # linux-hardened を追加でインストールし、セットアップ完了後に旧 linux を外す。
      pacman -Syu --noconfirm --needed --ignore linux \
        base-devel ca-certificates curl git jq unzip sqlite tmux \
        shadow slirp4netns fuse-overlayfs iptables-nft \
        docker-compose opencode linux-hardened

      # rootless docker 用の subuid/subgid
      grep -q "^$U:" /etc/subuid || usermod --add-subuids 100000-165535 "$U"
      grep -q "^$U:" /etc/subgid || usermod --add-subgids 100000-165535 "$U"

      # Arch の公式パッケージには rootless 用の部品 (dockerd-rootless.sh) が無い
      # (AUR だけ) ので、docker 公式の rootless インストーラーで静的バイナリを
      # 利用者のホームに入れる。
      # rootful デーモンは入れない。
      # インストーラーは iptables 用のモジュールが読み込み済みかを確かめる
      modprobe -a nf_tables ip_tables iptable_nat || true
      loginctl enable-linger "$U"
      for _ in $(seq 1 60); do [ -S "/run/user/$UID_/bus" ] && break; sleep 1; done
      runuser -u "$U" -- env HOME="/home/$U" XDG_RUNTIME_DIR="/run/user/$UID_" \
        DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UID_/bus" \
        sh -c 'curl -fsSL https://get.docker.com/rootless | sh' 2>&1 | tee /dev/ttyS0
      echo "DOCKER_HOST=unix:///run/user/$UID_/docker.sock" >> /etc/environment
      echo 'export PATH="$HOME/bin:$PATH"' >> "/home/$U/.bash_profile"

      runuser -u "$U" -- env XDG_RUNTIME_DIR="/run/user/$UID_" \
        DOCKER_HOST="unix:///run/user/$UID_/docker.sock" \
        "/home/$U/bin/docker" info --format '{{"{{"}}.SecurityOptions{{"}}"}}' | grep -q rootless
      # compose プラグインは pacman の docker-compose (/usr/lib/docker/cli-plugins)
      runuser -l "$U" -c 'docker compose version'

      # opencode (v2) は pacman で入れた /usr/bin/opencode
      test -x /usr/bin/opencode

      # Claude Code (公式のネイティブインストーラー)
      runuser -l "$U" -c 'curl -fsSL https://claude.ai/install.sh | bash'
      test -x "/home/$U/.local/bin/claude"
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> "/home/$U/.bash_profile"

      # Antigravity CLI (agy) (公式インストーラー)
      # Google Frontend が gzip で返すことがあるので --compressed で受ける。
      runuser -l "$U" -c 'curl -fsSL --compressed https://antigravity.google/cli/install.sh | bash'
      test -x "/home/$U/.local/bin/agy"

      # Codex CLI (公式インストーラー)
      runuser -l "$U" -c 'curl -fsSL https://chatgpt.com/codex/install.sh | bash'
      test -x "/home/$U/.local/bin/codex"

      # 作業ディレクトリ
      install -d -o "$U" -g "$U" /work

      # 起動オプションの硬化 (既存の値を消さずに追記する。ヒアドキュメントは
      # 終端行が YAML のリテラルブロックを壊すので使わず printf で1行追記する)
      if [ -f /etc/default/grub ] && ! grep -q 'slab_nomerge' /etc/default/grub; then
        printf '%s\n' 'GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off pti=on oops=panic"' >> /etc/default/grub
      fi

      # 旧カーネルを削除し、GRUB 設定を更新して linux-hardened で起動するようにする
      pacman -Rdd --noconfirm --nosave linux
      if command -v grub-mkconfig >/dev/null 2>&1; then
        grub-mkconfig -o /boot/grub/grub.cfg
      fi

      # パッケージキャッシュを掃除し、未使用領域を解放してイメージを小さくする
      # (pacman -Scc は --noconfirm だと既定の No で何も消さないので yes を流す)
      yes | pacman -Scc || true
      fstrim -av || true

      # 実行時の VM は外向き通信がほぼ無く NTP で時刻が合わない。時刻合わせを待つ
      # サービスが起動を止めてしまう (sshd や cloud-init の最終段階が始まらない) ので
      # 無効にする。時計は KVM が host から与える。
      systemctl mask systemd-time-wait-sync.service

      echo {{.Marker}} > /dev/ttyS0
runcmd:
  - [/usr/local/sbin/quagent-build.sh]
power_state:
  mode: poweroff
  timeout: 30
