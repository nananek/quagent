#cloud-config
# quagent ベースイメージ (Gentoo Linux, hardened)。{{.User}} と {{.Marker}} は
# quagent が埋める。成功したら {{.Marker}} をシリアルコンソールに出し、最後に
# 電源を切ること。
#
# Gentoo は cloud image のファイル名にタイムスタンプが入るので、recipe.json の
# latest_url で今のファイル名を解決する (URL 中の $FILE)。
users:
  - name: {{.User}}
    shell: /bin/bash
    lock_passwd: true
# Gentoo の cloud-init は emerge を packages: で扱わないので、焼き込みはすべて
# 自前のスクリプトで行う (rootless docker・opencode・Claude Code・カーネル硬化)。
write_files:
  # カーネルが rootless docker に必要な機能 (Gentoo wiki の docker スニペット)。
  - path: /etc/kernel/config.d/50-quagent-docker.config
    permissions: '0644'
    content: |
      # rootless docker 用 (Gentoo wiki より)
      CONFIG_BRIDGE_NETFILTER=m
      CONFIG_NETFILTER_FAMILY_BRIDGE=y
      CONFIG_NF_NAT_REDIRECT=y
      CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
      CONFIG_NETFILTER_XT_MATCH_IPVS=m
      CONFIG_IP_VS=m
      CONFIG_IP_VS_PROTO_TCP=y
      CONFIG_IP_VS_PROTO_UDP=y
      CONFIG_IP_VS_RR=m
      CONFIG_IP_VS_NFCT=y
      CONFIG_IP_NF_RAW=m
      CONFIG_IP_NF_TARGET_MASQUERADE=m
      CONFIG_IP_NF_TARGET_REDIRECT=m
      CONFIG_BRIDGE_VLAN_FILTERING=y
      CONFIG_VLAN_8021Q=m
      CONFIG_DUMMY=m
      CONFIG_MACVLAN=m
      CONFIG_IPVLAN=m
      CONFIG_VXLAN=m
      CONFIG_NETFILTER_XT_MARK=m
  # カーネル硬化。Gentoo の USE=hardened が入れる hardened-base.config に
  # 上乗せする (署名・lockdown・ABI 削減・起動時オプションの前提)。
  # config.d はファイル名順にマージされ、後のものが勝つ。配布の
  # dist-amd64-livecd.config より後に来るよう、zz- という名前にしている。
  - path: /etc/kernel/config.d/zz-quagent-hardening.config
    permissions: '0644'
    content: |
      # メモリ・スタック
      CONFIG_INIT_STACK_ALL_ZERO=y
      CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
      CONFIG_INIT_ON_FREE_DEFAULT_ON=y
      CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
      CONFIG_ZERO_CALL_USED_REGS=y
      CONFIG_VMAP_STACK=y
      CONFIG_DEFAULT_MMAP_MIN_ADDR=65536

      # カーネルメモリ・実行ファイルの保護
      CONFIG_STRICT_KERNEL_RWX=y
      CONFIG_STRICT_MODULE_RWX=y
      CONFIG_DEBUG_WX=y
      CONFIG_DEVMEM=n
      CONFIG_PROC_KCORE=n
      CONFIG_COMPAT_BRK=n

      # ランダム化と投機実行対策。シンボルはカーネルの版で改名される
      # (PAGE_TABLE_ISOLATION / RETPOLINE は 6.8 で MITIGATION_ 接頭辞になった)。
      # 焼き込みの最後に verify_config が実際に効いたかを確かめる。
      CONFIG_RANDOMIZE_BASE=y
      CONFIG_RANDOMIZE_MEMORY=y
      CONFIG_MITIGATION_PAGE_TABLE_ISOLATION=y
      CONFIG_MITIGATION_RETPOLINE=y
      CONFIG_CPU_MITIGATIONS=y

      # 攻撃面の削減 (32bit バイナリ・x32 は動かさない)。BPF の JIT 硬化は
      # CONFIG_BPF_JIT_HARDEN が廃止され、sysctl (net.core.bpf_jit_harden) に
      # 移った。sysctl.d の 90-quagent-hardening.conf で 2 にする。io_uring は
      # 6.18 では CONFIG で無効化できない (n にしても y に戻る) ので、同じ
      # sysctl.d の kernel.io_uring_disabled で止める。
      CONFIG_LEGACY_VSYSCALL_NONE=y
      CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
      CONFIG_BPF_JIT_ALWAYS_ON=y
      CONFIG_X86_X32_ABI=n
      CONFIG_IA32_EMULATION=n
      CONFIG_KEXEC=n
      CONFIG_HIBERNATION=n
      CONFIG_UEVENT_HELPER=n
      CONFIG_FW_LOADER_USER_HELPER=n

      # 攻撃面の削減: VM に出てこないハードウェアのドライバはビルドしない。
      # 実行時の VM にあるのは virtio とエミュレートされた基本デバイスだけで、
      # virtio・vsock・KVM はここで消える系統の外にあるので残る。
      # なお、単に =n と書くだけでは足りないものがある。Kconfig の select は
      # 明示の =n より強いので、select する側も一緒に止める。6.18 では
      # iSCSI/FCoE オフロード (実機の HBA 用) の 3 つが select ETHERNET し、
      # USB 周辺機器 (タブレット・マウス・ジョイスティック等) の 18 個が
      # select USB する。
      CONFIG_SCSI_BNX2_ISCSI=n
      CONFIG_SCSI_BNX2X_FCOE=n
      CONFIG_SCSI_CXGB3_ISCSI=n
      CONFIG_ETHERNET=n
      CONFIG_SOUND=n
      CONFIG_MEDIA_SUPPORT=n
      CONFIG_MMC=n
      CONFIG_WLAN=n
      CONFIG_BT=n
      CONFIG_NFC=n
      CONFIG_CAN=n
      CONFIG_INFINIBAND=n
      CONFIG_STAGING=n
      CONFIG_INPUT_ATI_REMOTE2=n
      CONFIG_INPUT_KEYSPAN_REMOTE=n
      CONFIG_INPUT_POWERMATE=n
      CONFIG_INPUT_YEALINK=n
      CONFIG_INPUT_CM109=n
      CONFIG_JOYSTICK_PXRC=n
      CONFIG_JOYSTICK_XPAD=n
      CONFIG_MOUSE_APPLETOUCH=n
      CONFIG_MOUSE_BCM5974=n
      CONFIG_MOUSE_SYNAPTICS_USB=n
      CONFIG_TABLET_USB_ACECAD=n
      CONFIG_TABLET_USB_AIPTEK=n
      CONFIG_TABLET_USB_HANWANG=n
      CONFIG_TABLET_USB_KBTAB=n
      CONFIG_TABLET_USB_PEGASUS=n
      CONFIG_TOUCHSCREEN_USB_COMPOSITE=n
      CONFIG_USB_PULSE8_CEC=n
      CONFIG_USB_RAINSHADOW_CEC=n
      CONFIG_USB=n

      # 土台の配布カーネル設定に頼らず、硬化をここで明示する。
      CONFIG_HARDENED_USERCOPY=y
      CONFIG_FORTIFY_SOURCE=y
      CONFIG_STACKPROTECTOR=y
      CONFIG_STACKPROTECTOR_STRONG=y
      CONFIG_SLAB_FREELIST_RANDOM=y
      CONFIG_SLAB_FREELIST_HARDENED=y
      CONFIG_RANDOM_KMALLOC_CACHES=y
      CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
      CONFIG_LIST_HARDENED=y
      CONFIG_X86_KERNEL_IBT=y
      CONFIG_SECURITY_LANDLOCK=y
      CONFIG_SECURITY_YAMA=y
      CONFIG_BPF_LSM=y

      # モジュール署名 (ビルドが鍵を生成し、署名の無いモジュールを拒否する)
      CONFIG_MODULE_SIG=y
      CONFIG_MODULE_SIG_ALL=y
      CONFIG_MODULE_SIG_SHA512=y
      CONFIG_MODULE_SIG_FORCE=y
      CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"

      # セキュリティ層 (lockdown を常時 confidentiality で強制する)
      CONFIG_SECURITY_LOCKDOWN_LSM=y
      CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
      CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y
      CONFIG_SECURITY_DMESG_RESTRICT=y
      CONFIG_SECURITY_SAFESETID=y
      CONFIG_LSM="landlock,yama,safesetid,bpf,lockdown"

      # 硬化の前提が崩れたら止める
      CONFIG_BUG_ON_DATA_CORRUPTION=y
      CONFIG_PANIC_ON_OOPS=y
      CONFIG_SCHED_STACK_END_CHECK=y
  # 実行時の硬化。
  - path: /etc/sysctl.d/90-quagent-hardening.conf
    permissions: '0644'
    content: |
      kernel.kptr_restrict=2
      kernel.dmesg_restrict=1
      kernel.yama.ptrace_scope=2
      kernel.unprivileged_bpf_disabled=2
      kernel.perf_event_paranoid=3
      kernel.sysrq=0
      # io_uring は 6.18 の CONFIG では止められないので、実行時に無効化する
      kernel.io_uring_disabled=2
      net.core.bpf_jit_harden=2
      vm.unprivileged_userfaultfd=0
      fs.suid_dumpable=0
      fs.protected_hardlinks=1
      fs.protected_symlinks=1
      fs.protected_fifos=2
      fs.protected_regular=2
      dev.tty.ldisc_autoload=0
  # slirp4netns (rootless docker のネットワーク) が使う。ip_tables は
  # rootless docker が iptables (legacy) を使うため。
  - path: /etc/modules-load.d/quagent.conf
    permissions: '0644'
    content: |
      tun
      overlay
      ip_tables
  - path: /usr/local/sbin/quagent-build.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail
      # シリアル getty は ttyS0 を初期化し直すときに焼き込みの出力を消すことが
      # あるので止める (実行時のイメージには残らない)。
      systemctl stop serial-getty@ttyS0.service || true
      # 焼き込みの出力はファイルに書き、別プロセスの tail が serial (コンソール
      # ログ) へ流す。ttyS0 への書き込みが詰まっても焼き込みは止まらない。失敗
      # したときはログの末尾を ttyS0 へ直接流し、どの行で落ちたかを残す (電源が
      # 切れる前に流れるよう、少し待ってから終わる)。
      LOG=/var/log/quagent-build.log
      : > "$LOG"
      tail -n +1 -F "$LOG" > /dev/ttyS0 2>/dev/null &
      TAIL_PID=$!
      exec &>> "$LOG"
      trap 'rc=$?; set +e; echo "quagent-build: 失敗 (rc=$rc, line=$LINENO)"; timeout 15 tail -n 150 "$LOG" > /dev/ttyS0 || true; kill "$TAIL_PID" 2>/dev/null; sleep 10; rm -f "$LOG"; exit $rc' ERR
      U={{.User}}
      UID_=$(id -u "$U")

      # 焼き込みのあいだだけ ptrace を許す。git 2.52 以降の Rust 部品 (USE=rust、
      # 既定で有効) は cargo が PTRACE_TRACEME を使うが、硬化設定の
      # kernel.yama.ptrace_scope=2 はこれを拒否してビルドが落ちる。sysctl.d の
      # 設定自体は触らないので、起動し直したイメージでは 2 に戻る。土台に yama が
      # 無ければ書けないが、そのときの既定は 0 なので緩める必要も無い。
      echo 1 > /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || true

      # クラウドイメージには Portage ツリーが入っていない (make.profile は
      # /var/db/repos/gentoo を指しているだけ)。ツリーを取ってから切り替える。
      # 差分更新のときは、ここでツリーが最新になる。
      emerge-webrsync -q

      # hardened プロファイル (no-multilib/systemd のまま硬化)。USE=hardened が入り、
      # 以降に建てるものとカーネルが硬化される。
      eselect profile set default/linux/amd64/23.0/no-multilib/hardened/systemd

      # 差分更新でもベースシステム全体 (@world) は更新しない。配布イメージの base は
      # リリースエンジニアリングが焼いた古い stage で、新しいツリーだと
      # lvm2 → thin-provisioning-tools → Rust/clang/LLVM のような大きなビルドを
      # 呼ぶことがある (数時間かかる)。base ごと更新したいときは --refresh で
      # クラウドイメージから焼き直す。

      # rootless docker の部品。Gentoo では ~amd64 なので鍵を自動で足す。
      # git は run 時の取り込み (repo の bundle を fetch して checkout する) と、
      # PR 化のとき host が取り込む git-upload-pack に要る。
      emerge --update --oneshot --autounmask-continue \
        dev-vcs/git app-containers/slirp4netns sys-fs/fuse-overlayfs

      # rootless docker (公式の rootless インストーラー)。rootful デーモンは入れない。
      # インストーラーは iptables (legacy) のモジュールが読み込まれているか確認する。
      # agent には sudo が無いので、root のここで先に読み込んでおく。
      modprobe ip_tables
      loginctl enable-linger "$U"
      for _ in $(seq 1 60); do [ -S "/run/user/$UID_/bus" ] && break; sleep 1; done
      runuser -u "$U" -- env HOME="/home/$U" XDG_RUNTIME_DIR="/run/user/$UID_" \
        DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UID_/bus" \
        sh -c 'curl -fsSL https://get.docker.com/rootless | sh'
      if ! grep -qF 'export PATH="$HOME/bin:$PATH"' "/home/$U/.bash_profile"; then
        echo 'export PATH="$HOME/bin:$PATH"' >> "/home/$U/.bash_profile"
      fi
      if ! grep -qF 'DOCKER_HOST=unix:///run/user/' /etc/environment; then
        echo "DOCKER_HOST=unix:///run/user/$UID_/docker.sock" >> /etc/environment
      fi
      runuser -u "$U" -- env XDG_RUNTIME_DIR="/run/user/$UID_" \
        DOCKER_HOST="unix:///run/user/$UID_/docker.sock" \
        "/home/$U/bin/docker" info --format '{{"{{"}}.SecurityOptions{{"}}"}}' | grep rootless > /dev/null

      # opencode (v2)
      runuser -l "$U" -c 'curl -fsSL https://opencode.ai/v2/install | bash'
      test -x "/home/$U/.opencode/bin/opencode"
      if ! grep -qF 'export PATH="$HOME/.opencode/bin:$PATH"' "/home/$U/.bash_profile"; then
        echo 'export PATH="$HOME/.opencode/bin:$PATH"' >> "/home/$U/.bash_profile"
      fi

      # Claude Code (公式のネイティブインストーラー)
      runuser -l "$U" -c 'curl -fsSL https://claude.ai/install.sh | bash'
      test -x "/home/$U/.local/bin/claude"
      if ! grep -qF 'export PATH="$HOME/.local/bin:$PATH"' "/home/$U/.bash_profile"; then
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> "/home/$U/.bash_profile"
      fi

      # 作業ディレクトリ
      install -d -o "$U" -g "$U" /work

      # カーネルを硬化 CONFIG で作り直す (ここまで網が要るので最後に行う)。
      # 差分更新のときは、新しい版が入ったときだけ建て直される (それ以外は数秒)。
      emerge --update --oneshot --newuse --autounmask-continue sys-kernel/gentoo-kernel

      # 要求した硬化 CONFIG が実際に効いたかを確かめる。カーネルの版でシンボルが
      # 改名・廃止されると、書いた行は黙って無視され (merge_config は警告するだけ)、
      # 硬化が効かないカーネルを焼いてしまう。書いた行と config を 1 行ずつ突き合わせ、
      # ずれがあれば焼き込みを失敗させる。config fragment を直すときは、ここも通る
      # ように (実在するシンボルと値にする) する。
      # 今ビルドしたカーネルの config を照合する。バージョン付きの置き場を
      # 新しい順に選び、無ければ symlink に落とす。土台の config を掴んで
      # いないか分かるよう、使ったパスを残す。
      KCONFIG=$(ls -1 /usr/src/linux-*/.config 2>/dev/null | sort -V | tail -1 || true)
      [ -r "$KCONFIG" ] || KCONFIG=/usr/src/linux/.config
      test -r "$KCONFIG" || { echo "quagent-build: カーネル config ($KCONFIG) が見つからない"; exit 1; }
      echo "quagent-build: 硬化 CONFIG を ${KCONFIG} と突き合わせる"
      verify_config() {
        local sym want got
        while IFS= read -r line; do
          case "$line" in '#'*|'') continue ;; esac
          sym=${line%%=*}; want=${line#*=}
          # =n は config では "# CONFIG_X is not set" になる
          if [ "$want" = n ] && grep -qE "^# ${sym} is not set$" "$KCONFIG"; then continue; fi
          got=$( { grep -E "^${sym}=" "$KCONFIG" || true; } | tail -1 | cut -d= -f2-)
          if [ "${got:-}" != "$want" ]; then
            echo "quagent-build: カーネル設定が反映されていない: ${sym}=${want} (実際: ${got:-無し})"
            return 1
          fi
        done < "$1"
      }
      verify_config /etc/kernel/config.d/50-quagent-docker.config
      verify_config /etc/kernel/config.d/zz-quagent-hardening.config

      # 起動オプションの硬化 (既存の値を消さずに追記する。差分更新で二重に
      # 追記しないよう、入っていれば何もしない)。起動時に上書きできないものは
      # CONFIG 側 (lockdown・モジュール署名) で強制している。
      if ! grep -q 'slab_nomerge' /etc/default/grub; then
        cat >> /etc/default/grub <<'GRUBEOF'
      GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off pti=on oops=panic"
      GRUBEOF
      fi
      grub-mkconfig -o /boot/grub/grub.cfg

      # ビルドに使ったキャッシュをイメージに残さない (Portage の作業場・
      # distfiles・binhost のバイナリ)。次は必要になった分だけ取り直す。
      rm -rf /var/tmp/portage /var/tmp/emerge-webrsync.*
      rm -rf /var/cache/distfiles /var/cache/binhost
      # 実行時には使わないビルド依存をイメージに残さない。cloud image には
      # git や dev-util/maturin の BDEPEND として dev-lang/rust-bin (cargo /
      # rustc、約 700MB) が入っているが、opencode も git も実行時には使わない。
      # 次に git を建て直すときは Portage が入れ直す。
      if ls -d /var/db/pkg/dev-lang/rust-bin-* >/dev/null 2>&1; then
        emerge --quiet --unmerge dev-lang/rust-bin
      fi
      # 消した分をホスト側 (qcow2) からも解放して、できたイメージを小さくする。
      # discard 非対応の環境でも焼き込みは続ける。
      fstrim -av || true

      # 焼き込みのログはイメージに残さない。
      kill "$TAIL_PID" 2>/dev/null || true
      rm -f "$LOG"

      echo {{.Marker}} > /dev/ttyS0
runcmd:
  - [/usr/local/sbin/quagent-build.sh]
power_state:
  mode: poweroff
  timeout: 60
